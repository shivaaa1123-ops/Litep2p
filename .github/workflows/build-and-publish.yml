name: Build, test & publish

# Standard-runner CI: Android build + JVM unit tests + desktop C ABI tests on
# every push/PR, and Maven artifact production + GitHub Release upload on tags
# (`v<version>`, e.g. `v0.3.0`). The self-hosted stress/WAN workflows remain
# scheduled/nightly separately.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # allows the tag job to create/attach a GitHub Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_COMPILE_SDK: 36
  ANDROID_BUILD_TOOLS: 36.0.0
  # Must match `ndkVersion` in litep2p-core/build.gradle.kts.
  ANDROID_NDK: 26.1.10909125

jobs:
  # ---------------------------------------------------------------------------
  # Android: JVM unit tests + release AAR for both thread-mode flavors.
  # Compiles every ABI in litep2p-core's abiFilters and uploads the AARs.
  # ---------------------------------------------------------------------------
  android:
    name: Android (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        flavor: [ multiThread, singleThread ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform, build-tools, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" \
                     "build-tools;${ANDROID_BUILD_TOOLS}" \
                     "ndk;${ANDROID_NDK}" \
                     "cmake;3.22.1"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + assemble release
        run: |
          ./gradlew \
            ":litep2p-core:test${MAIN_FLAVOR}DebugUnitTest" \
            ":litep2p-core:assemble${MAIN_FLAVOR}Release"
        env:
          MAIN_FLAVOR: ${{ matrix.flavor }}

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: litep2p-core-${{ matrix.flavor }}
          path: litep2p-core/build/outputs/aar/litep2p-core-${{ matrix.flavor }}-release.aar
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Desktop: build + run the hermetic C++ test suites (same engine +
  # litep2p.h contract as Android). Runs on ubuntu (epoll reactor path).
  #
  # Included suites are all loopback/in-memory (no external network):
  #   c_api_test            — public C ABI conformance (lifecycle, config,
  #                           disconnect suppression, file-transfer errors,
  #                           overlay end-to-end)
  #   crypto_test           — Noise NK / transport-key primitives
  #   nat_traversal_test    — STUN parsing, reconnect policy (local sockets)
  #   file_transfer_test    — chunking/resume round-trips on local files
  #   overlay_test          — LPX2 onion routing, mailboxes, replay/TTL
  #   proxy_test            — LPX1 tunnel framing over loopback
  #   session_manager_test  — session/peer-FSM suite. HERMETIC since v0.4:
  #                           network.discovery_port is config-driven and the
  #                           test binds a unique per-run port, and the
  #                           dynamic port_range is disabled, so no foreign
  #                           LAN broadcasts can reach the FSM.
  #   malformed_input_test  — deterministic parser-robustness regression
  #                           (wire codec, discovery announce, Noise NK).
  #                           Complements the libFuzzer harnesses (fuzz job).
  #
  # Excluded (deliberately):
  #   wan_integration_runner, message_size_runner — require real networks;
  #                           covered by the self-hosted SG/US workflows.
  #   quic_test             — requires vendored picoquic/picotls builds not
  #                           present on standard runners.
  # -------------------------------------------------------------------------
  desktop-c-test:
    name: Desktop C ABI tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libsodium-dev nlohmann-json3-dev

      - name: Configure
        run: cmake -S desktop -B desktop/build-ci -DCMAKE_BUILD_TYPE=Release

      - name: Build test suites
        run: |
          cmake --build desktop/build-ci -j"$(nproc)" --target \
            c_api_test \
            crypto_test \
            nat_traversal_test \
            file_transfer_test \
            overlay_test \
            proxy_test \
            session_manager_test \
            malformed_input_test

      - name: Run C ABI conformance tests
        run: ./desktop/build-ci/bin/c_api_test

      - name: Run crypto tests
        run: ./desktop/build-ci/bin/crypto_test

      - name: Run NAT traversal tests
        run: ./desktop/build-ci/bin/nat_traversal_test

      - name: Run file transfer tests
        run: ./desktop/build-ci/bin/file_transfer_test

      - name: Run overlay tests
        run: ./desktop/build-ci/bin/overlay_test

      - name: Run proxy tests
        run: ./desktop/build-ci/bin/proxy_test

      - name: Run session manager tests (hermetic)
        run: ./desktop/build-ci/bin/session_manager_test

      - name: Run malformed-input parser regression
        run: ./desktop/build-ci/bin/malformed_input_test

  # -------------------------------------------------------------------------
  # Parser fuzzing: coverage-guided libFuzzer runs of the wire parsers
  # (wire codec, discovery announcement, Noise NK handshake/decrypt). Ubuntu
  # clang ships the libFuzzer runtime, unlike Apple clang. The fuzz targets
  # are EXCLUDE_FROM_ALL; build/run them explicitly. Short `-runs` smoke on
  # every push; extend the corpus/`-max_total_time` for nightly hardening.
  # -------------------------------------------------------------------------
  fuzz:
    name: Parser fuzz (libFuzzer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libsodium-dev nlohmann-json3-dev

      - name: Configure (fuzz build)
        run: |
          cmake -S desktop -B desktop/build-fuzz \
            -DLITEP2P_FUZZING=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build fuzz harnesses
        run: |
          cmake --build desktop/build-fuzz -j"$(nproc)" --target \
            fuzz_wire_codec fuzz_discovery fuzz_noise_handshake

      - name: Fuzz wire codec
        run: ./desktop/build-fuzz/bin/fuzz_wire_codec -runs=20000 -max_len=4096

      - name: Fuzz discovery announcement parser
        run: ./desktop/build-fuzz/bin/fuzz_discovery -runs=20000 -max_len=4096

      - name: Fuzz Noise NK handshake/decrypt
        run: ./desktop/build-fuzz/bin/fuzz_noise_handshake -runs=20000 -max_len=4096

  # ---------------------------------------------------------------------------
  # Publish: only on tags `v*`. Produces the Maven artifacts (AAR + POM +
  # sources + KDoc) for both flavors via publishToMavenLocal and attaches them
  # to the GitHub Release. Guard: tag must match gradle.properties version.
  # (Maven Central publishing can be added by wiring mavenCentral() + signing;
  # see docs/api-spec.md §2.1.)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Maven artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop-c-test]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build-tools, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" \
                     "build-tools;${ANDROID_BUILD_TOOLS}" \
                     "ndk;${ANDROID_NDK}" \
                     "cmake;3.22.1"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches LITEP2P_VERSION
        run: |
          SDK_VERSION="$(grep -m1 '^LITEP2P_VERSION=' gradle.properties | cut -d= -f2)"
          if [ "${GITHUB_REF_NAME#v}" != "${SDK_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match LITEP2P_VERSION=${SDK_VERSION} in gradle.properties"
            exit 1
          fi
          echo "Publishing version ${SDK_VERSION}"

      - name: Build + publish to Maven Local (validates and produces artifacts)
        run: |
          ./gradlew \
            :litep2p-core:publishMultiThreadReleasePublicationToMavenLocal \
            :litep2p-core:publishSingleThreadReleasePublicationToMavenLocal

      - name: Stage release artifacts
        run: |
          mkdir -p release-artifacts
          cp -rv "$HOME/.m2/repository/com/zeengal/litep2p-core/"* release-artifacts/

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true